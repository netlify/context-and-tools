name: release-please

# Cuts releases and publishes them (EX-3049, EX-3054).
#
# On every push to main, release-please maintains the Release PR. Merging it
# tags vX.Y.Z and creates the GitHub release, and the two jobs below then
# ship that tag:
#
#   publish-npm    @netlify/skills at the tag's version: the whole set,
#                  manifest.json, and the `netlify-skills` command that installs
#                  single skills out of it. Skipped if that version is already
#                  on the registry, so a re-run never fails on a half-finished
#                  publish.
#   deploy-hosted  the Netlify site: every release's skills + manifest.json,
#                  rebuilt from git tags by scripts/build-hosted.mjs, so the
#                  deploy has no state of its own and re-publishing is safe.
#
# npm goes first and the site waits for it: the package is what consumers
# depend on, so the site must never advertise a release npm does not have. A
# site failure after npm shipped is recoverable by re-running the failed jobs.
#
# Everything is in this one file on purpose. npm Trusted Publishing (OIDC)
# validates the filename of the workflow that minted the token (for a
# reusable workflow, the calling one), and the trusted publisher for
# @netlify/skills is configured for release-please.yml (IT-3868). npm auth is
# the job's OIDC token: `id-token: write`, `registry-url` set, and no
# NODE_AUTH_TOKEN or NPM_TOKEN anywhere. Node 24 ships npm 11.5.1+, which
# Trusted Publishing needs; the run checks that rather than assuming it.
#
# release-please itself runs with a GitHub App token (TOKENS_APP_ID and
# TOKENS_PRIVATE_KEY, the org's Token Generator app; IT-3868 installs it on
# this repo) so the Release PR it opens gets CI like any other PR. Until those
# two repository or organization secrets exist, it falls back to GITHUB_TOKEN
# with a warning: releases still cut, the Release PR just gets no CI.
#
# There is no manual entry point. A failed or partial publish is recovered
# with "Re-run failed jobs" on the release's own run (Actions tab): that
# re-runs the same commit with the same workflow file, so the provenance
# attestation npm writes still names the commit that was packed, and the
# skip-if-published check makes a full re-run safe. A workflow_dispatch was
# tried and dropped twice: run from main it attested the wrong commit, and
# run from a tag it let anyone with write access publish a tag they created
# on their own commit with the checks removed. Only a release cut by
# release-please on main publishes; the run checks that the tag it was handed
# points at the commit it is building, is on main, and has a GitHub release.
# If a second merge lands before the release run executes and the tag ends up
# on an earlier commit than the run is building, publish refuses and that
# version is never published; the next release supersedes it.
#
# Those checks live in this file, so a copy of it on a branch could drop them.
# The controls a branch copy cannot drop: the `publish` environment both jobs
# run in, with a deployment branch policy of `main` only (any other ref, tags
# included, is refused before the job starts), NETLIFY_AUTH_TOKEN and
# NETLIFY_SITE_ID as its environment secrets, and the same environment named
# on the npm trusted publisher (an OIDC token minted outside it is refused by
# npm). A tag ruleset on `v*` (no update or delete) keeps a published tag
# pointing where it did, which matters because deploy-hosted builds every
# past release by tag name; it also refuses if this release's tag moved.

on:
  push:
    branches: [main]

permissions: {}

# One run at a time: two merges minutes apart must not race to update the
# same Release PR, and two publishes must not deploy the site out of order.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # `secrets` is not readable in a step `if`; an env var is.
      HAS_APP_TOKEN: ${{ secrets.TOKENS_APP_ID != '' && secrets.TOKENS_PRIVATE_KEY != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: env.HAS_APP_TOKEN == 'true'
        id: app-token
        with:
          app-id: ${{ secrets.TOKENS_APP_ID }}
          private-key: ${{ secrets.TOKENS_PRIVATE_KEY }}

      - if: env.HAS_APP_TOKEN != 'true'
        run: echo "::warning::TOKENS_APP_ID / TOKENS_PRIVATE_KEY are not set (IT-3868); using GITHUB_TOKEN, so the Release PR gets no CI"

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance attestation
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    outputs:
      # The commit the tag pointed at when it was verified; deploy-hosted
      # builds exactly this, not the tag name again.
      sha: ${{ steps.verify.outputs.sha }}
      result: ${{ steps.npm.outputs.result }}
    steps:
      - name: Check the run is a push to main and the tag is a release tag
        run: |
          if [ "$GITHUB_EVENT_NAME:$GITHUB_REF" != "push:refs/heads/main" ]; then
            echo "::error::publish runs only from a push to main; got $GITHUB_EVENT_NAME on $GITHUB_REF"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like vX.Y.Z, got: $TAG"
            exit 1
          fi

      # Checks out the run's own commit (GITHUB_SHA, the merge commit that was
      # tagged). Full history: the tag is verified against
      # main below, and per-skill versions in manifest.json are derived from
      # the release tags that precede this one.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false

      # Only a real release publishes: the tag exists, it points at the commit
      # this run is building (so the provenance attestation names the packed
      # source), main contains it, and release-please created a GitHub release
      # for it. A hand-pushed tag or a tag on an unmerged branch fails here.
      - name: Verify the tag is a release on main and names this commit
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! sha="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            echo "::error::no tag ${TAG} in ${GITHUB_REPOSITORY}"
            exit 1
          fi
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag ${TAG} points at ${sha}, but this run is building ${GITHUB_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::tag ${TAG} is not reachable from main"
            exit 1
          fi
          if ! gh release view "$TAG" --json tagName --jq .tagName > /dev/null; then
            echo "::error::no GitHub release for ${TAG}; only releases cut by release-please are published"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publishing ${TAG} at ${sha}"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true
          # Tells npm which registry to mint the OIDC token for. Deliberately
          # no NODE_AUTH_TOKEN.
          registry-url: "https://registry.npmjs.org"

      - name: Check npm is 11.5.1 or newer (Trusted Publishing needs it)
        run: |
          have="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$have" | sort -V | head -n 1)" != "11.5.1" ]; then
            echo "::error::npm ${have} is older than 11.5.1"
            exit 1
          fi
          echo "npm ${have}"

      # release-please stamps package.json at the tag; a mismatch means the
      # tag is not a release commit.
      - name: Verify package version matches the tag
        run: |
          pkg="$(node -p 'require("./package.json").version')"
          if [ "v$pkg" != "$TAG" ]; then
            echo "::error::package.json is $pkg but the tag is $TAG"
            exit 1
          fi

      - name: Build manifest.json
        run: node scripts/build-manifest.mjs --out manifest.json

      # Same assertion as validate-skills' package-check, repeated here because
      # this is the run that actually ships the tarball.
      - name: Check the npm tarball contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/pack.json"
          node -e '
            const [pkg] = require(process.argv[1]);
            const files = new Set(pkg.files.map((f) => f.path));
            const want = ["manifest.json", "skills/CLAUDE.md", "skills/netlify-functions/SKILL.md", "README.md", "LICENSE", "bin/netlify-skills.mjs", "scripts/fetch-skill.mjs", "scripts/build-manifest.mjs"];
            const missing = want.filter((f) => !files.has(f));
            if (missing.length) { console.error(`::error::tarball is missing ${JSON.stringify(missing)}`); process.exit(1); }
            console.log(`${pkg.name}@${pkg.version}: ${files.size} files`);
          ' "$RUNNER_TEMP/pack.json"

      # Idempotent re-runs: skip only when the registry positively says this
      # version exists. Any other `npm view` failure (network, outage) fails
      # the step rather than masquerading as "already published".
      - name: Publish @netlify/skills
        id: npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version --json > "$RUNNER_TEMP/view.json" 2> "$RUNNER_TEMP/view.err"; then
            if [ -s "$RUNNER_TEMP/view.json" ] && [ "$(cat "$RUNNER_TEMP/view.json")" != "[]" ]; then
              echo "${name}@${version} is already published; nothing to do."
              echo "result=already_published" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          elif ! grep -q "E404" "$RUNNER_TEMP/view.err"; then
            echo "::error::could not query the registry for ${name}@${version}:"
            cat "$RUNNER_TEMP/view.err"
            exit 1
          fi
          npm publish --provenance --access public
          echo "result=published" >> "$GITHUB_OUTPUT"

  deploy-hosted:
    needs: [release-please, publish-npm]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      SHA: ${{ needs.publish-npm.outputs.sha }}
    steps:
      - name: Preflight — required secrets
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          missing=""
          [ -z "$NETLIFY_AUTH_TOKEN" ] && missing="$missing NETLIFY_AUTH_TOKEN"
          [ -z "$NETLIFY_SITE_ID" ] && missing="$missing NETLIFY_SITE_ID"
          if [ -n "$missing" ]; then
            echo "::error::Hosted skills deploy is not configured. Missing secret(s):$missing"
            exit 1
          fi

      # The commit publish-npm verified and packed, by hash, not the tag name
      # again. Its checkout supplies the build script and netlify.toml; the
      # content comes from every tag in history, so fetch them all.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.publish-npm.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # build-hosted materialises every release by tag name, so a tag moved
      # between the two jobs would change what the site serves. Refuse.
      - name: Verify the tag still points at the published commit
        run: |
          now="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}" || echo missing)"
          if [ "$now" != "$SHA" ]; then
            echo "::error::tag ${TAG} moved to ${now} since npm published ${SHA}; not deploying"
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          check-latest: true

      - name: Build hosted site from git tags
        run: node scripts/build-hosted.mjs --out dist

      # The tag being published must be in the output, and latest must be the
      # highest tag, not necessarily this one: a re-run of an older release's
      # jobs must never roll the root back.
      - name: Verify the tag is in the build
        run: |
          version="${TAG#v}"
          node -e '
            const v = require("./dist/versions.json");
            const [want] = process.argv.slice(1);
            if (!v.versions.includes(want)) { console.error(`::error::${want} is not in dist/versions.json`); process.exit(1); }
            console.log(`publishing ${want}; latest is ${v.latest}`);
          ' "$version"

      # The site advertises `latest`, which is the highest tag, not this one.
      # If a newer release's npm publish failed and an older release's run is
      # being re-run, `latest` would name a version npm never got. Refuse; the
      # fix is to re-run the newer release's run first.
      #
      # A version npm has just accepted takes a few minutes to appear in the
      # registry's read path (npm says so on publish), and this job starts
      # seconds after publish-npm, so poll before concluding it is missing.
      # The first release did exactly this: published, then "not on npm".
      - name: Verify latest is on npm
        run: |
          name="$(node -p 'require("./package.json").name')"
          latest="$(node -p 'require("./dist/versions.json").latest')"
          for attempt in $(seq 1 20); do
            if [ -n "$(npm view "${name}@${latest}" version 2>/dev/null)" ]; then
              echo "${name}@${latest} is on npm"
              exit 0
            fi
            echo "${name}@${latest} not visible yet (attempt ${attempt}/20); waiting 30s"
            sleep 30
          done
          echo "::error::${name}@${latest} is not on npm after 10 minutes, so the site cannot advertise it as latest. Re-publish v${latest} first."
          exit 1

      - name: Deploy to Netlify
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@23.13.0 deploy --prod --no-build --dir dist --json \
            --message "publish ${TAG} at ${SHA} (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" \
            > "$RUNNER_TEMP/deploy.json"
          url="$(node -p 'require(process.argv[1]).url' "$RUNNER_TEMP/deploy.json")"
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The contract a consumer relies on, run against the live site: a client
      # with no repo access reads the manifest and confirms the skills it has
      # (here, the ones we just built) are exactly the live set. --strict makes
      # a missing or extra skill fail too, not just a stale one.
      - name: Smoke test the live site
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: node scripts/fetch-skill.mjs --host "$URL" --check dist/skills --strict

  # Pings context-hub (EX-3255) when release-please opens or updates its release
  # PR and when a release is created; context-hub posts the Slack notice. Pings
  # go to CONTEXT_HUB_URL from the ctx-pipeline environment (inert until it and
  # CONTEXT_HUB_PIPELINE_KEY exist). Telemetry only: continue-on-error, and
  # nothing needs this job, so it never blocks or reddens a release or publish.
  notify-hub:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && (needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.release_created == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: ctx-pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Ping context-hub (release PR)
        if: ${{ needs.release-please.outputs.prs_created == 'true' }}
        env:
          # env indirection: the PR title is attacker-shaped text and must reach
          # the script as data, never interpolated into command text.
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          CONTEXT_HUB_URL: ${{ vars.CONTEXT_HUB_URL }}
          CONTEXT_HUB_PIPELINE_KEY: ${{ secrets.CONTEXT_HUB_PIPELINE_KEY }}
        run: node scripts/ctx-hub-ping.mjs release-pr-opened

      - name: Ping context-hub (release created)
        if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CONTEXT_HUB_URL: ${{ vars.CONTEXT_HUB_URL }}
          CONTEXT_HUB_PIPELINE_KEY: ${{ secrets.CONTEXT_HUB_PIPELINE_KEY }}
        run: node scripts/ctx-hub-ping.mjs release-created

  # Pings context-hub (EX-3255) with how the two publish jobs ended (npm result,
  # site result) whenever a release was created; context-hub posts the Slack
  # notice. Runs after success or failure but not after a cancelled run, is
  # continue-on-error, and nothing needs it, so it never blocks publishing.
  report:
    needs: [release-please, publish-npm, deploy-hosted]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: ctx-pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Ping context-hub (publish finished)
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          NPM_JOB_RESULT: ${{ needs.publish-npm.result }}
          NPM_OUTCOME: ${{ needs.publish-npm.outputs.result }}
          SITE_JOB_RESULT: ${{ needs.deploy-hosted.result }}
          CONTEXT_HUB_URL: ${{ vars.CONTEXT_HUB_URL }}
          CONTEXT_HUB_PIPELINE_KEY: ${{ secrets.CONTEXT_HUB_PIPELINE_KEY }}
        run: node scripts/ctx-hub-ping.mjs publish-finished
