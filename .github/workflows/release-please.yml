name: release-please

# Cuts releases and publishes them (EX-3049, EX-3054).
#
# On every push to main, release-please maintains the Release PR. Merging it
# tags vX.Y.Z, and the `publish` job below hands that tag to publish.yml,
# which publishes @netlify/skills to npm and the skills to the hosted site.
# Chained here because the GitHub release is created with GITHUB_TOKEN, which
# never triggers `on: release` workflows.
#
# A manual run with a tag re-publishes that release after a fix or a failed
# run. The manual entry point lives in this file, not in publish.yml, on
# purpose: npm Trusted Publishing validates the *calling* workflow's filename,
# so the trusted publisher configured on npmjs.com for @netlify/skills points
# at this file, and every publish must start here.
#
# `id-token: write` is what lets `npm publish` mint an OIDC token; it has to
# be granted by the caller (here) and by the reusable workflow (publish.yml).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)publish, e.g. v1.4.0"
        required: true
        type: string

permissions: {}

# Two quick merges to main must not race to update the same Release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    # `!cancelled()` lets this run when release-please was skipped (a manual run).
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    # Only what publish.yml declares; npm needs no secret (OIDC).
    secrets:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    permissions:
      contents: read
      id-token: write

  # Pings context-hub (EX-3255) when release-please opens or updates its release
  # PR and when a release is created; context-hub posts the Slack notice. Pings
  # go to CONTEXT_HUB_URL from the ctx-pipeline environment (inert until it and
  # CONTEXT_HUB_PIPELINE_KEY exist). Telemetry only: continue-on-error, and
  # nothing needs this job, so it never blocks or reddens a release or publish.
  notify-hub:
    needs: release-please
    if: ${{ !cancelled() && needs.release-please.result == 'success' && (needs.release-please.outputs.prs_created == 'true' || needs.release-please.outputs.release_created == 'true') }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment: ctx-pipeline
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Ping context-hub (release PR)
        if: ${{ needs.release-please.outputs.prs_created == 'true' }}
        env:
          # env indirection: the PR title is attacker-shaped text and must reach
          # the script as data, never interpolated into command text.
          PR_JSON: ${{ needs.release-please.outputs.pr }}
          CONTEXT_HUB_URL: ${{ vars.CONTEXT_HUB_URL }}
          CONTEXT_HUB_PIPELINE_KEY: ${{ secrets.CONTEXT_HUB_PIPELINE_KEY }}
        run: node scripts/ctx-hub-ping.mjs release-pr-opened

      - name: Ping context-hub (release created)
        if: ${{ needs.release-please.outputs.release_created == 'true' }}
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          CONTEXT_HUB_URL: ${{ vars.CONTEXT_HUB_URL }}
          CONTEXT_HUB_PIPELINE_KEY: ${{ secrets.CONTEXT_HUB_PIPELINE_KEY }}
        run: node scripts/ctx-hub-ping.mjs release-created
