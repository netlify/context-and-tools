# Hosted skills + manifest (EX-3049).
#
# The site is a pure build output of this repo: scripts/build-hosted.mjs
# materializes every release tag from git into dist/, so the deploy has no
# state of its own and can be rebuilt from any checkout. It is deployed with
# `netlify deploy --prod --no-build --dir dist` by .github/workflows/publish.yml
# after release-please tags a release. Do not connect the site to Git: a
# Netlify build clone has no tags to build from, and a Git-triggered deploy
# would race the release publish.
#
# Layout:
#   /manifest.json            latest release
#   /skills/<name>/<file>     latest release
#   /versions.json            every published version + which one is latest
#   /v/<version>/manifest.json, /v/<version>/skills/<name>/<file>
#
# Header rules must not overlap: Netlify applies every matching rule and
# joins duplicate header values, so a `/*` catch-all would corrupt the
# Cache-Control of everything under it.

# A tagged skill file never changes: it is `git archive` output of the tag.
[[headers]]
  for = "/v/:version/skills/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

# A tagged manifest is regenerated by the current build-manifest.mjs on each
# publish. Its content is stable while schema_version stays 1, but the bytes
# are not frozen, so it gets a day rather than a year.
[[headers]]
  for = "/v/:version/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

# Latest: short-lived so a new release is visible within minutes.
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/versions.json"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/skills/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
