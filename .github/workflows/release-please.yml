name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Two quick merges to main must not race to update the same Release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A merged Release PR tags vX.Y.Z; that tag is what gets published to the
  # hosted site and npm. Chained here because the GitHub release above is
  # created with GITHUB_TOKEN, which never triggers `on: release` workflows.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
    permissions:
      contents: read
      id-token: write
